apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node
  template:
    metadata:
      labels:
        app: node
    spec:
      containers:
      - name: node
        image: your-ecr-repo/node-app:latest  # Push your Docker image to ECR
        ports:
        - containerPort: 3000